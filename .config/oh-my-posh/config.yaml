  # <<< palettes

blocks:
  # ── left: square blocks separated by thin gaps ─────────────────────────────
  # Blocks have flat ends and sit side by side (the vi-mode block opens with a
  # caret-shaped notch instead). Each block after the first
  # opens with U+258F (left one-eighth block) drawn in "transparent" -- the
  # terminal background -- on the block's own colour, so a 1/8-cell sliver of
  # terminal shows between neighbours. The rest of that cell is the block's
  # colour, so it doubles as the left padding (templates have no leading
  # space). The last block (git) closes with a powerline arrow; outside a
  # repo the directory block ends flat.
  # For a wider gap, use U+258E (1/4) or U+258D (3/8) instead.
  # Earlier variants: arrow + notch (a one-cell chevron gap) and solid arrows
  # with a thin \ue0b1 line inside each block (rejected).
  - type: prompt
    alignment: left
    newline: true # blank line between command output and the prompt (p10k PROMPT_ADD_NEWLINE)
    segments:
      # p10k vi_mode: I / N / V on the grey block; replace mode turns it yellow.
      # Follows the keymap live: oh-my-posh's zsh init re-renders on
      # zle-keymap-select whenever a vimode segment is present.
      - type: vimode
        # First block: opens with a caret-shaped notch, so a terminal-coloured
        # caret points into the prompt. \ue0d7 is a full cell with a
        # right-pointing triangle cut out of its left side, drawn in the
        # block's colour on the terminal background -- so the cell's left edge
        # is terminal colour. (The earlier version drew \ue0b0 in terminal
        # colour on the block's colour instead, and the font's triangle stops
        # short of the cell edge, leaving a strip of grey in front of the
        # caret.) Flat on the right; the next block's sliver gap follows.
        style: diamond
        leading_diamond: "\ue0d7"
        trailing_diamond: ""
        background: p:vi_bg
        foreground: p:vi_fg
        background_templates:
          - '{{ if eq .Mode "replace" }}p:overwrite_bg{{ end }}'
        template: ' <b>{{ if eq .Mode "normal" }}N{{ else if eq .Mode "visual" }}V{{ else if eq .Mode "replace" }}OVERTYPE{{ else }}I{{ end }}</b> '

      - type: os
        style: diamond
        leading_diamond: "<transparent,background>\u258f</>"
        trailing_diamond: ""
        background: p:os_bg
        foreground: p:os_fg
        options:
          macos: "\uf179" # monochrome apple, not the colour emoji
        template: "{{ .Icon }} "

      # p10k dir: open-folder icon, path shortened powerlevel-style once it
      # passes 80 columns (p10k DIR_MAX_LENGTH=80).
      - type: path
        style: diamond
        leading_diamond: "<transparent,background>\u258f</>"
        trailing_diamond: ""
        background: p:dir_bg
        foreground: p:dir_fg
        options:
          style: powerlevel
          max_width: 80
        template: "\uf07c <b>{{ .Path }}</b> "

      # p10k vcs + my_git_formatter: block coloured by state
      # (conflicted red > modified yellow > untracked-only > clean green),
      # then branch, behind/ahead, stashes, conflicts, staged, unstaged and
      # untracked counts with the same glyphs.
      - type: git
        style: diamond
        leading_diamond: "<transparent,background>\u258f</>"
        trailing_diamond: "\ue0b0"
        background: p:git_clean
        foreground: p:git_fg
        background_templates:
          - "{{ if gt .Working.Unmerged 0 }}p:git_conflicted{{ end }}"
          - "{{ if or .Staging.Changed (gt (add .Working.Modified .Working.Deleted) 0) }}p:git_modified{{ end }}"
          - "{{ if gt .Working.Untracked 0 }}p:git_untracked{{ end }}"
        options:
          fetch_status: true
          fetch_stash_count: true
          branch_icon: "\uf418 "
          branch_max_length: 32
        template: >-
          {{ "\uf1d3 " }}<b>{{ .HEAD }}</b>
          {{- if .Behind }} {{ "\uf01a" }} <b>{{ .Behind }}</b>{{ end }}
          {{- if .Ahead }} {{ "\uf01b" }} <b>{{ .Ahead }}</b>{{ end }}
          {{- if gt .StashCount 0 }} {{ "\uf01c" }} <b>{{ .StashCount }}</b>{{ end }}
          {{- if gt .Working.Unmerged 0 }} <b>~{{ .Working.Unmerged }}</b>{{ end }}
          {{- $staged := add .Staging.Added .Staging.Modified .Staging.Deleted .Staging.Moved }}
          {{- if gt $staged 0 }} {{ "\uf055" }} <b>{{ $staged }}</b>{{ end }}
          {{- $unstaged := add .Working.Modified .Working.Deleted }}
          {{- if gt $unstaged 0 }} {{ "\uf06a" }} <b>{{ $unstaged }}</b>{{ end }}
          {{- if gt .Working.Untracked 0 }} {{ "\uf059" }} <b>{{ .Working.Untracked }}</b>{{ end }} {{ "" }}

  # ── right: flat text, no blocks ─────────────────────────────────────────────
  # p10k's flat right prompt promoted each segment's background colour to its
  # foreground; same here.
  - type: rprompt
    segments:
      - type: executiontime
        style: plain
        foreground: p:git_modified
        options:
          threshold: 3000 # p10k COMMAND_EXECUTION_TIME_THRESHOLD=3
          style: round
        template: " {{ .FormattedMs }}"

      - type: ruby
        style: plain
        foreground: p:ruby
        template: " \ue791 {{ .Full }}"

      - type: node
        style: plain
        foreground: p:node
        template: " \ue718 {{ .Full }}"

      - type: python
        style: plain
        foreground: p:python
        template: " \ue235 {{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}"

      - type: go
        style: plain
        foreground: p:go
        template: " \ue65e {{ .Full }}"

      - type: rust
        style: plain
        foreground: p:muted
        template: " \ue7a8 {{ .Full }}"

      - type: java
        style: plain
        foreground: p:muted
        template: " \ue256 {{ .Full }}"

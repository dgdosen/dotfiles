# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
#
# Oh My Posh prompt, laid out like the powerlevel10k setup in ~/.p10k.zsh:
#   left  (powerline blocks): vi mode | os icon > directory > git
#   right (flat, no blocks):  command duration and language versions as
#                             coloured text on the terminal background
#
# Loaded by .zshrc when the prompt engine is "omp" (`prompt-engine omp`).
#
# Colours: every colour below is a palette key (p:name). The palettes at the
# bottom are generated from .p10k-themes/*.zsh by .bin/gen-posh-palettes, so
# both prompts share one source of colours. The active palette is
# $POSH_PALETTE, which .zshrc sets from the active theme (the .p10k-theme
# symlink) and switch-theme updates in idle Rex panes.
#
# Bold: <b>...</b> in a template. Used for the vi-mode letter, the directory,
# and the git branch and its change counts -- the text you read -- while the
# icons and the right prompt stay regular. Kept in dark themes too: regular
# black text on the pastel blocks looks too thin. Needs a bold face of the
# Nerd Font in the terminal.
#
# Glyphs are written as \uXXXX escapes, which YAML only interprets inside
# double quotes -- keep these strings double-quoted. They are the same
# monochrome Nerd Font codepoints the p10k config uses.

version: 3
final_space: true


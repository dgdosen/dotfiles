# High-contrast Catppuccin Latte: the accent colours are stock Catppuccin
# darkened (lightness only, hue and saturation kept) to >= 5:1 contrast against
# the #eff1f5 background. The stock accents only reached 2.3-4.8:1, so yellow,
# green and pink text was hard to read. These values match .p10k-themes/catppuccin-latte.zsh,
# the Rex "Catppuccin Latte" theme (.config/rex/themes.json) and the Neovim
# color_overrides (nvim_dgd/lua/plugins/ui.lua). Was -> now:
#   red #d20f39->#cb0e37  green #40a02b->#2e741f  yellow #df8e1d->#8e5a12
#   blue #1e66f5->#0b58f1 pink #ea76cb->#ba1c90   teal #179299->#127278
#   peach (index 16) #fe640b->#b24101

[colors.primary]
background = "#eff1f5"
foreground = "#4c4f69"
dim_foreground = "#5c5f77"
bright_foreground = "#4c4f69"

[colors.cursor]
text = "#eff1f5"
cursor = "#dc8a78"

[colors.vi_mode_cursor]
text = "#eff1f5"
cursor = "#7287fd"

[colors.search.matches]
foreground = "#eff1f5"
background = "#6c6f85"

[colors.search.focused_match]
foreground = "#eff1f5"
background = "#2e741f"

[colors.footer_bar]
foreground = "#eff1f5"
background = "#6c6f85"

[colors.hints.start]

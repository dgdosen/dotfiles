# Colors (Merino Light)
# Copied from Rex's built-in "merino-light" theme (Rex.app themes.json);
# same palette as GitHub Light Default.

# Default colors
[colors.primary]
background = '#ffffff'
foreground = '#1f2328'

[colors.cursor]
cursor = '#0969da'
text   = '#b6d8ff'

[colors.selection]
background = '#1f2328'
text       = '#ffffff'

# Normal colors
[colors.normal]
black   = '#24292f'
red     = '#cf222e'
green   = '#116329'
yellow  = '#9d5c00'
blue    = '#0969da'
magenta = '#8250df'
cyan    = '#1b7c83'
white   = '#6e7781'

# Bright colors
[colors.bright]
black   = '#57606a'
red     = '#a40e26'
green   = '#1a7f37'
yellow  = '#c47a00'
blue    = '#218bff'
magenta = '#a475f9'
cyan    = '#3192aa'
white   = '#8c959f'
